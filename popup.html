<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Grove · 快速整理</title><link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><div class="brand-icon" aria-hidden="true">▥</div><div><h1>Tab Grove</h1><p>给网页一个位置，让思路更清晰。</p></div><span class="local">本机</span></header>
  <div class="demo" id="demo" hidden>弹窗界面演示 · 显示示例数据</div>
  <main>
    <div class="section-title"><label for="scope">整理范围</label><select id="scope" disabled><option value="current">当前窗口</option><option value="all">全部窗口</option></select></div>
    <section class="stats" aria-label="整理范围概况"><div><strong id="tab-count">—</strong><span>标签页</span></div><div><strong id="site-count">—</strong><span>网站</span></div><div><strong id="duplicate-count">—</strong><span>重复网址页</span></div></section>
    <section class="current" aria-label="一键整理"><div class="current-heading"><span class="site-icon" aria-hidden="true">▥</span><div><h2>一键整理所有网页</h2><p id="organize-summary">正在读取标签页…</p></div></div><p class="hint">与完整管理页使用相同规则，合并同站子域名，并应用已记住的 label。</p><button class="primary" id="organize" disabled>一键按域名分组</button><p class="hint">跳过固定标签页和内部页面，窗口保持独立。</p><div id="confirmation" hidden><p id="confirm-description"></p><p class="hint">所选网页可能离开原有标签组；不会关闭网页。</p><div class="confirm-actions"><button id="cancel-organize" class="secondary">取消</button><button id="confirm-organize" class="primary">开始整理</button></div></div></section>
    <section class="preferences" aria-label="快捷开关"><label><span><b>新网页自动归组</b><small>打开网页，自动放进对应 label</small></span><input id="auto-group" type="checkbox" role="switch" disabled></label><label><span><b>显示悬浮小助手</b><small>随时整理当前网页，或新建 label</small></span><input id="pet-enabled" type="checkbox" role="switch" disabled></label></section>
    <p class="status" id="status" role="status" hidden></p>
  </main>
  <footer><button id="open-manager" class="manager" disabled><span><b>打开完整管理页面</b><small>浏览全部标签页 · 网站规则 · 精细设置</small></span><span aria-hidden="true">↗</span></button></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
